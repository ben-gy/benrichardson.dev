<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Orion/Artemis spacecraft - pixel art, classic Mac OS style -->
  <g transform="rotate(45, 16, 16)">
    <!-- Capsule nose cone (filled black) -->
    <rect x="15" y="3" width="2" height="1" fill="black"/>
    <rect x="14" y="4" width="4" height="1" fill="black"/>
    <rect x="13" y="5" width="6" height="1" fill="black"/>
    <rect x="12" y="6" width="8" height="1" fill="black"/>

    <!-- Capsule body walls (2px thick) -->
    <rect x="11" y="7" width="2" height="4" fill="black"/>
    <rect x="19" y="7" width="2" height="4" fill="black"/>
    <!-- Porthole window -->
    <rect x="15" y="8" width="2" height="2" fill="black"/>

    <!-- Heat shield (2px tall, wider than capsule) -->
    <rect x="10" y="11" width="12" height="2" fill="black"/>

    <!-- Service module walls (2px thick) -->
    <rect x="12" y="13" width="2" height="7" fill="black"/>
    <rect x="18" y="13" width="2" height="7" fill="black"/>
    <!-- Service module bottom -->
    <rect x="14" y="19" width="4" height="1" fill="black"/>

    <!-- Solar panel LEFT -->
    <rect x="1" y="15" width="13" height="1" fill="black"/>
    <rect x="1" y="16" width="2" height="2" fill="black"/>
    <rect x="6" y="16" width="2" height="2" fill="black"/>
    <rect x="1" y="18" width="13" height="1" fill="black"/>

    <!-- Solar panel RIGHT -->
    <rect x="18" y="15" width="13" height="1" fill="black"/>
    <rect x="24" y="16" width="2" height="2" fill="black"/>
    <rect x="29" y="16" width="2" height="2" fill="black"/>
    <rect x="18" y="18" width="13" height="1" fill="black"/>

    <!-- Engine nozzle -->
    <rect x="14" y="20" width="4" height="1" fill="black"/>
    <rect x="14" y="21" width="1" height="2" fill="black"/>
    <rect x="17" y="21" width="1" height="2" fill="black"/>
    <rect x="13" y="23" width="6" height="1" fill="black"/>

    <!-- Exhaust -->
    <rect x="15" y="24" width="2" height="1" fill="black"/>
    <rect x="15" y="26" width="2" height="1" fill="black"/>
  </g>
</svg>
